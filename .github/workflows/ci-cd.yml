name: CI/CD — CloudLab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloudlab

jobs:
  # ─── BUILD & PUSH ────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push backend image
        run: |
          docker build -t ${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/cloudlab-backend:latest \
                       ./backend
          docker push ${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/cloudlab-backend:latest

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/cloudlab-frontend:latest \
                       ./frontend
          docker push ${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/cloudlab-frontend:latest

  # ─── DEPLOY TO CLOUD RUN ─────────────────────────────────────
  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy cloudlab-backend \
            --image=${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=3001 \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }},DB_PATH=/tmp/users.db" \
            --memory=256Mi \
            --cpu=1

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe cloudlab-backend \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy cloudlab-frontend \
            --image=${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80 \
            --set-env-vars="BACKEND_URL=${{ steps.backend-url.outputs.url }}" \
            --memory=128Mi \
            --cpu=1

      - name: Print deployed URLs
        run: |
          echo "✅ Backend: ${{ steps.backend-url.outputs.url }}"
          FRONT=$(gcloud run services describe cloudlab-frontend \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Frontend: $FRONT"

  # ─── DEPLOY TO GKE (optional) ────────────────────────────────
  deploy-gke:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # Comment out this job if you only use Cloud Run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials cloudlab-cluster \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Create namespace if needed
        run: kubectl apply -f k8s/frontend.yaml --dry-run=client | grep namespace || kubectl create namespace cloudlab --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests with new image tag
        run: |
          # Replace REGISTRY and IMAGE_TAG placeholders
          sed -i "s|REGISTRY|${{ env.REGISTRY }}|g" k8s/backend.yaml k8s/frontend.yaml
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/backend.yaml k8s/frontend.yaml

          kubectl apply -f k8s/frontend.yaml   # creates namespace
          kubectl apply -f k8s/backend.yaml

      - name: Rollout restart (force new pods)
        run: |
          kubectl rollout restart deployment/backend  -n cloudlab
          kubectl rollout restart deployment/frontend -n cloudlab

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend  -n cloudlab --timeout=120s
          kubectl rollout status deployment/frontend -n cloudlab --timeout=120s

      - name: Show pods
        run: kubectl get pods -n cloudlab
