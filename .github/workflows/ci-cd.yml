name: CI/CD — CloudLab

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: cloudlab-497319
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/cloudlab-497319/cloudlab
  WORKLOAD_IDENTITY_PROVIDER: projects/528677768363/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: cloudlab-deployer@cloudlab-497319.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/cloudlab-backend:latest \
                       ./backend
          docker push ${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/cloudlab-backend:latest

      - name: Build & push frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/cloudlab-frontend:latest \
                       ./frontend
          docker push ${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/cloudlab-frontend:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy cloudlab-backend \
            --image=${{ env.REGISTRY }}/cloudlab-backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=3001 \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}"

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe cloudlab-backend \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy cloudlab-frontend \
            --image=${{ env.REGISTRY }}/cloudlab-frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=80 \
            --set-env-vars="BACKEND_URL=${{ steps.backend-url.outputs.url }}"

      - name: Print URLs
        run: |
          echo "✅ Backend: ${{ steps.backend-url.outputs.url }}"
          FRONT=$(gcloud run services describe cloudlab-frontend \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Frontend: $FRONT"
